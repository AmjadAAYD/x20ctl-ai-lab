<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 460" width="1320" height="460" font-family="Segoe UI, Inter, Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1320" height="460" rx="16" fill="url(#bgGrad)"/>

  <!-- Header -->
  <text x="40" y="48" fill="#f8fafc" font-size="22" font-weight="700">Architecture n8n : Triage Automatique d'Issues GitHub (X20CTL AI Lab)</text>
  <text x="40" y="72" fill="#94a3b8" font-size="13">Chaine complete : Declencheur -&gt; Traitement -&gt; IA Locale (Qwen 3.5 9B) -&gt; Integrations Externes -&gt; Resultat</text>

  <!-- Stage 1: Trigger -->
  <rect x="35" y="120" width="210" height="220" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2" filter="url(#shadow)"/>
  <rect x="35" y="120" width="210" height="36" rx="12" fill="#0284c7"/>
  <rect x="35" y="144" width="210" height="12" fill="#0284c7"/>
  <text x="140" y="143" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">1. DECLENCHEUR</text>
  <text x="140" y="185" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="700">GitHub Trigger</text>
  <text x="140" y="206" text-anchor="middle" fill="#94a3b8" font-size="12">Webhook HTTPS (issues)</text>
  <rect x="55" y="226" width="170" height="46" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="140" y="246" text-anchor="middle" fill="#bae6fd" font-size="12" font-weight="600">Filter Opened Issues</text>
  <text x="140" y="262" text-anchor="middle" fill="#94a3b8" font-size="11">action === "opened"</text>
  <text x="140" y="315" text-anchor="middle" fill="#64748b" font-size="11">Tunnel Cloudflare / ngrok</text>

  <!-- Arrow 1 -> 2 -->
  <line x1="245" y1="230" x2="292" y2="230" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <text x="268" y="216" text-anchor="middle" fill="#bae6fd" font-size="10" font-weight="600">JSON</text>
  <text x="268" y="246" text-anchor="middle" fill="#94a3b8" font-size="10">Issue</text>

  <!-- Stage 2: Processing -->
  <rect x="298" y="120" width="225" height="220" rx="12" fill="#1e293b" stroke="#818cf8" stroke-width="2" filter="url(#shadow)"/>
  <rect x="298" y="120" width="225" height="36" rx="12" fill="#4f46e5"/>
  <rect x="298" y="144" width="225" height="12" fill="#4f46e5"/>
  <text x="410" y="143" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">2. TRAITEMENT</text>
  <rect x="316" y="172" width="189" height="38" rx="7" fill="#0f172a" stroke="#334155"/>
  <text x="410" y="195" text-anchor="middle" fill="#e0e7ff" font-size="12" font-weight="600">GET /readme (Base64)</text>
  <rect x="316" y="218" width="189" height="38" rx="7" fill="#0f172a" stroke="#334155"/>
  <text x="410" y="241" text-anchor="middle" fill="#e0e7ff" font-size="12" font-weight="600">GET /issues?state=open</text>
  <rect x="316" y="264" width="189" height="44" rx="7" fill="#0f172a" stroke="#6366f1"/>
  <text x="410" y="284" text-anchor="middle" fill="#c7d2fe" font-size="12" font-weight="600">Build AI Prompt (JS)</text>
  <text x="410" y="300" text-anchor="middle" fill="#94a3b8" font-size="10">Contexte + schema strict</text>

  <!-- Arrow 2 -> 3 -->
  <line x1="523" y1="230" x2="570" y2="230" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="546" y="216" text-anchor="middle" fill="#cbd5e1" font-size="10" font-weight="600">Prompt</text>
  <text x="546" y="246" text-anchor="middle" fill="#94a3b8" font-size="10">README</text>

  <!-- Stage 3: Local AI -->
  <rect x="576" y="120" width="235" height="220" rx="12" fill="#1e293b" stroke="#c084fc" stroke-width="2" filter="url(#shadow)"/>
  <rect x="576" y="120" width="235" height="36" rx="12" fill="#7e22ce"/>
  <rect x="576" y="144" width="235" height="12" fill="#7e22ce"/>
  <text x="693" y="143" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">3. IA LOCALE (OLLAMA)</text>
  <rect x="594" y="174" width="199" height="58" rx="8" fill="#0f172a" stroke="#a855f7"/>
  <text x="693" y="196" text-anchor="middle" fill="#f3e8ff" font-size="13" font-weight="700">Qwen 3.5 9B</text>
  <text x="693" y="214" text-anchor="middle" fill="#d8b4fe" font-size="11">T=0.2 | think=false | JSON</text>
  <text x="693" y="226" text-anchor="middle" fill="#94a3b8" font-size="10">host.docker.internal:11434</text>
  <rect x="594" y="246" width="199" height="54" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="693" y="268" text-anchor="middle" fill="#e9d5ff" font-size="12" font-weight="600">Parse &amp; Validate JSON</text>
  <text x="693" y="285" text-anchor="middle" fill="#94a3b8" font-size="10">Labels autorises + Reponse MD</text>

  <!-- Arrow 3 -> 4 -->
  <line x1="811" y1="230" x2="858" y2="230" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="834" y="216" text-anchor="middle" fill="#cbd5e1" font-size="10" font-weight="600">JSON</text>
  <text x="834" y="246" text-anchor="middle" fill="#94a3b8" font-size="10">valide</text>

  <!-- Stage 4: External Integrations -->
  <rect x="864" y="120" width="220" height="220" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
  <rect x="864" y="120" width="220" height="36" rx="12" fill="#d97706"/>
  <rect x="864" y="144" width="220" height="12" fill="#d97706"/>
  <text x="974" y="143" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">4. INTEGRATIONS</text>
  <rect x="882" y="172" width="184" height="44" rx="7" fill="#0f172a" stroke="#f59e0b"/>
  <text x="974" y="191" text-anchor="middle" fill="#fef3c7" font-size="12" font-weight="600">POST /issues/.../labels</text>
  <text x="974" y="207" text-anchor="middle" fill="#94a3b8" font-size="10">Branche parallele 1</text>
  <rect x="882" y="224" width="184" height="44" rx="7" fill="#0f172a" stroke="#f59e0b"/>
  <text x="974" y="243" text-anchor="middle" fill="#fef3c7" font-size="12" font-weight="600">POST /issues/.../comments</text>
  <text x="974" y="259" text-anchor="middle" fill="#94a3b8" font-size="10">Branche parallele 2 (1x)</text>
  <rect x="882" y="276" width="184" height="44" rx="7" fill="#0f172a" stroke="#334155" stroke-dasharray="4 3"/>
  <text x="974" y="295" text-anchor="middle" fill="#cbd5e1" font-size="11" font-weight="600">Discord Webhook</text>
  <text x="974" y="311" text-anchor="middle" fill="#64748b" font-size="10">Optionnel (desactive)</text>

  <!-- Arrow 4 -> 5 -->
  <line x1="1084" y1="230" x2="1130" y2="230" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <text x="1107" y="216" text-anchor="middle" fill="#6ee7b7" font-size="10" font-weight="600">HTTP</text>
  <text x="1107" y="246" text-anchor="middle" fill="#94a3b8" font-size="10">201</text>

  <!-- Stage 5: Result -->
  <rect x="1136" y="120" width="150" height="220" rx="12" fill="#1e293b" stroke="#34d399" stroke-width="2" filter="url(#shadow)"/>
  <rect x="1136" y="120" width="150" height="36" rx="12" fill="#059669"/>
  <rect x="1136" y="144" width="150" height="12" fill="#059669"/>
  <text x="1211" y="143" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">5. RESULTAT</text>
  <text x="1211" y="185" text-anchor="middle" fill="#d1fae5" font-size="13" font-weight="700">Issue Triee</text>
  <text x="1211" y="215" text-anchor="middle" fill="#94a3b8" font-size="11">- Labels appliques</text>
  <text x="1211" y="236" text-anchor="middle" fill="#94a3b8" font-size="11">- Doublon detecte</text>
  <text x="1211" y="257" text-anchor="middle" fill="#94a3b8" font-size="11">- Reponse sourcee</text>
  <text x="1211" y="278" text-anchor="middle" fill="#94a3b8" font-size="11">- Priorite estimee</text>
  <text x="1211" y="314" text-anchor="middle" fill="#34d399" font-size="12" font-weight="700">~6 a 12 sec</text>

  <!-- Footer legend -->
  <rect x="35" y="370" width="1251" height="58" rx="10" fill="#0f172a" stroke="#334155"/>
  <text x="58" y="395" fill="#e2e8f0" font-size="12" font-weight="700">Confidentialite &amp; Fiabilite :</text>
  <text x="242" y="395" fill="#94a3b8" font-size="12">100% local via Ollama (qwen3.5:9b). Aucun code ni discussion envoye vers un LLM cloud.</text>
  <text x="58" y="415" fill="#94a3b8" font-size="12">Validation deterministe JS : seuls les labels autorises (bug, enhancement, question, documentation, duplicate) sont acceptes.</text>
</svg>
